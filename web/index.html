<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LGFX Font Tool JS — Viewer</title>
  <link rel="stylesheet" href="./styles/app.css">
</head>
<body>
  <header class="topbar">
    <h1>LGFX Font Tool JS <span class="sub">Viewer</span></h1>
    <a class="link" href="https://github.com/tanakamasayuki/LGFXFontToolJs">GitHub</a>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <input id="search" type="search" placeholder="フォントを検索 (186)" autocomplete="off">
      <ul id="font-list" class="font-list"></ul>
    </aside>

    <section class="content">
      <div class="controls">
        <label class="grow">テキスト
          <input id="text" type="text" value="Hello 日本語 123 こんにちは">
        </label>
        <label>倍率 X
          <input id="size-x" type="number" value="1" min="0.25" max="8" step="0.25">
        </label>
        <label>倍率 Y
          <input id="size-y" type="number" value="1" min="0.25" max="8" step="0.25">
        </label>
        <label>datum
          <select id="datum"></select>
        </label>
        <label>ズーム
          <input id="zoom" type="range" value="3" min="1" max="12" step="1">
        </label>
        <label class="check">グリッド
          <input id="grid" type="checkbox" checked>
        </label>
      </div>

      <div class="preview-wrap">
        <canvas id="preview"></canvas>
      </div>

      <dl id="info" class="info"></dl>
      <p id="license" class="license"></p>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
