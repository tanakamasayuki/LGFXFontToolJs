<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LGFX Font Tool JS — Viewer</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./styles/app.css">
</head>
<body class="viewer-page">
  <header class="topbar">
    <h1><a class="homelink" href="./index.html">LGFX Font Tool JS</a> <span class="sub" data-i18n="app.subtitle">Viewer</span></h1>
    <div class="topbar-right">
      <nav class="nav">
        <a href="./viewer.html" class="current" data-i18n="nav.viewer">Viewer</a>
        <a href="./generator.html" data-i18n="nav.generator">Generator</a>
        <a href="./converter.html" data-i18n="nav.converter">Converter</a>
        <a href="./inspector.html" data-i18n="nav.inspector">Inspector</a>
      </nav>
      <select id="lang" data-i18n-title="controls.language"></select>
      <a class="link" href="https://github.com/tanakamasayuki/LGFXFontToolJs">GitHub</a>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <input id="search" type="search" data-i18n-placeholder="search.placeholder" autocomplete="off">
      <ul id="font-list" class="font-list"></ul>
    </aside>

    <section class="content">
      <div class="controls">
        <label class="grow"><span data-i18n="controls.text">Text</span>
          <input id="text" type="text" value="Hello 日本語 123 こんにちは">
        </label>
        <label><span data-i18n="controls.sizeX">Scale X</span>
          <input id="size-x" type="number" value="1" min="0.25" max="8" step="0.25">
        </label>
        <label><span data-i18n="controls.sizeY">Scale Y</span>
          <input id="size-y" type="number" value="1" min="0.25" max="8" step="0.25">
        </label>
        <label><span data-i18n="controls.datum">Datum</span>
          <select id="datum"></select>
        </label>
        <label><span><span data-i18n="controls.zoom">Zoom</span> <output id="zoom-value" for="zoom">1×</output></span>
          <input id="zoom" type="range" value="1" min="1" max="12" step="1">
        </label>
        <label class="check"><span data-i18n="controls.grid">Grid</span>
          <input id="grid" type="checkbox" checked>
        </label>
      </div>

      <div class="preview-wrap">
        <canvas id="preview"></canvas>
      </div>

      <dl id="info" class="info"></dl>
      <p id="license" class="license"></p>
      <details class="charmap-details" id="font-charmap-details" open>
        <summary data-i18n="chars.title">Covered characters</summary>
        <div class="charmap-toolbar">
          <span class="sub" data-i18n="chars.note">Grouped by Unicode block. Use browser find to locate a character.</span>
          <button type="button" id="font-charmap-copy" data-i18n="chars.copy" disabled>Copy characters</button>
          <span class="sub" id="font-charmap-copy-status" aria-live="polite"></span>
        </div>
        <div class="charmap" id="font-charmap"></div>
      </details>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
