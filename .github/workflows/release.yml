# npm への公開は手元から行う（plainbind 方式。§16）:
#
#   npm login                      # 初回だけ
#   npm version 0.1.0              # preversion で check、VERSION 定数も自動同期
#   npm publish --access public    # prepack が build + types を実行
#   git push --follow-tags
#
# このワークフローは予備。npmjs.com 側で Trusted Publishing（GitHub Actions /
# このリポジトリ / release.yml）を設定するか NPM_TOKEN シークレットを置いた
# 場合にだけ、Actions タブから手動実行して CI から公開できる。
# タグ push では発火しない（ローカル公開と衝突して赤くならないように）。
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance / Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run types
      - run: npm run smoke:dist
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
